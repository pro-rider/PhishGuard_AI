# ==============================================================================
# 10. OOD EVALUATION
# ==============================================================================

ood_evaluation:

  enabled: true

  required_for_production: true

  dataset:

    identifier: "ood_holdout_v13"

    frozen: true

    immutable: true

    require_manifest: true

    require_sha256: true

  metrics:

    roc_auc:

      minimum: 0.9500

      gate_on: "lower_confidence_bound"

    pr_auc:

      minimum: 0.9000

      gate_on: "lower_confidence_bound"

    false_positive_rate:

      maximum: 0.0100

      gate_on: "upper_confidence_bound"

  distribution_shift:

    compare_to_test: true

    required: true

    methods:

      - "psi"
      - "ks_test"

    warning_thresholds:

      psi: 0.10

    critical_thresholds:

      psi: 0.25

  # --------------------------------------------------------------------------
  # Selective prediction / abstention
  # --------------------------------------------------------------------------

  abstention:

    enabled: true

    required_for_production: true

    confidence_policy:

      minimum_confidence: 0.60

      confidence_definition: "max_class_probability"

    metrics:

      coverage:

        minimum: 0.90

        gate_on: "lower_confidence_bound"

      abstention_rate:

        maximum: 0.10

        gate_on: "upper_confidence_bound"

      selective_risk:

        maximum: 0.020

        gate_on: "upper_confidence_bound"

      abstained_sample_error_rate:

        maximum: 1.00

        gate_on: "informational"

    safety:

      never_auto_block_abstained_sample: true

      route_abstained_samples_to: "sandbox_or_human_review"

      require_safe_fallback: true


# ==============================================================================
# 11. THRESHOLD VALIDATION
# ==============================================================================

threshold_validation:

  enabled: true

  required_for_production: true

  selection_dataset: "validation"

  validation_dataset: "test"

  forbidden_selection_datasets:

    - "test"
    - "ood"
    - "production"

  threshold_search:

    enabled: true

    minimum_threshold: 0.01

    maximum_threshold: 0.99

    step: 0.001

  threshold_stability:

    enabled: true

    bootstrap_samples: 2000

    maximum_threshold_stddev: 0.05

    require_stable_operating_region: true

  operating_point:

    must_satisfy_all_hard_constraints: true

    prefer_highest_recall_under_fpr_constraint: true

  artifact:

    required: true

    filename: "validated_threshold.json"

    require_sha256: true

    require_model_hash_match: true

    require_dataset_hash_match: true

    require_config_hash_match: true


# ==============================================================================
# 12. SLICE EVALUATION POLICY
# ==============================================================================

slice_evaluation:

  enabled: true

  required_for_production: true

  evaluate_all_declared_critical_slices: true

  minimum_support_enforced: true

  prohibit_silent_slice_exclusion: true

  missing_slice_behavior: "fail"

  insufficient_support_behavior: "fail"

  metrics:

    precision: true
    recall: true
    f1: true
    false_positive_rate: true
    false_negative_rate: true
    pr_auc: true

  degradation:

    compare_against_global_test_metrics: true

    maximum_relative_degradation: 0.10

    maximum_absolute_recall_drop: 0.05

    maximum_absolute_precision_drop: 0.05

  reporting:

    generate_slice_table: true

    generate_failure_examples: true

    store_raw_examples: false


# ==============================================================================
# 13. CALIBRATION POLICY
# ==============================================================================

calibration_policy:

  enabled: true

  required_for_production: true

  fit_only_on_validation: true

  evaluate_only_on_unseen_data: true

  forbidden_calibration_data:

    - "test"
    - "ood"
    - "production"

  methods:

    primary: "temperature_scaling"

    alternatives:

      - "sigmoid"

  metrics:

    ece:

      enabled: true

      bins: 15

      strategy: "uniform"

      maximum: 0.0500

    brier:

      enabled: true

      maximum: 0.1000

    log_loss:

      enabled: true

      maximum: 0.3000

  requirements:

    generate_reliability_diagram: true

    generate_calibration_report: true

    persist_calibration_parameters: true

    hash_calibration_artifact: true


# ==============================================================================
# 14. PRODUCTION BASELINE CONTRACT
# ==============================================================================

production_baseline:

  required_for_production: true

  source: "model_registry"

  selection_policy:

    status: "production"

    must_be_known_good: true

    must_have_passed_previous_gates: true

    must_have_valid_signature: true

    must_have_valid_manifest: true

  integrity:

    require_sha256: true

    require_model_hash: true

    require_feature_schema_hash: true

    require_preprocessing_hash: true

  comparison:

    paired_test_set: true

    same_threshold_policy: true

    same_preprocessing_contract: true

    same_label_mapping: true

    same_evaluation_protocol: true


# ==============================================================================
# 15. GATE SEVERITY & DECISION MODEL
# ==============================================================================

gate_decision:

  statuses:

    PASS:
      terminal: false

    WARN:
      terminal: false

    NOT_APPLICABLE:
      terminal: false

    FAIL:
      terminal: true

    ERROR:
      terminal: true

  required_gate_states:

    production:

      allowed:

        - "PASS"

      forbidden:

        - "WARN"
        - "NOT_APPLICABLE"
        - "FAIL"
        - "ERROR"

  warning_policy:

    allowed_in_development: true

    allowed_in_test: false

    allowed_in_staging: false

    allowed_in_production: false

  final_decision:

    all_required_gates_must_pass: true

    any_error_blocks_promotion: true

    any_required_gate_failure_blocks_promotion: true

    missing_metric_blocks_promotion: true

    missing_provenance_blocks_promotion: true


# ==============================================================================
# 16. PROVENANCE REQUIREMENTS
# ==============================================================================

provenance:

  required: true

  required_fields:

    - "model_id"
    - "model_version"
    - "artifact_version"

    - "model_sha256"
    - "manifest_sha256"

    - "dataset_id"
    - "dataset_version"
    - "dataset_manifest_sha256"

    - "feature_schema_version"
    - "feature_schema_sha256"

    - "preprocessing_version"
    - "preprocessing_sha256"

    - "evaluation_timestamp"

    - "evaluation_config_version"
    - "evaluation_config_sha256"

    - "evaluator_version"

    - "git_commit"
    - "git_dirty_state"

    - "python_version"
    - "framework_versions"

    - "operating_threshold"

    - "gate_status"

    - "failed_checks"

    - "warnings"

  signature:

    required_for_production: true

    algorithm: "ed25519"

    key_reference_env: "PHISHGUARD_MODEL_SIGNING_KEY"

    never_store_private_key: true


# ==============================================================================
# 17. REPORTING CONTRACT
# ==============================================================================

reporting:

  enabled: true

  output_directory: "artifacts/reports/evaluation_gates"

  formats:

    json: true

    markdown: true

    csv: true

  filenames:

    summary_json: "evaluation_summary.json"

    detailed_json: "evaluation_details.json"

    markdown: "evaluation_report.md"

    gate_status: "gate_status.json"

    metric_table: "metrics.csv"

    slice_table: "slice_metrics.csv"

    calibration_report: "calibration_report.json"

    regression_report: "regression_report.json"

    statistical_report: "statistical_tests.json"

  report_requirements:

    include_confidence_intervals: true

    include_sample_counts: true

    include_class_distribution: true

    include_threshold: true

    include_baseline_comparison: true

    include_failed_gates: true

    include_warnings: true

    include_dataset_hashes: true

    include_model_hashes: true

    include_config_hash: true

    include_runtime_environment: true

  raw_data:

    store_raw_predictions: false

    store_raw_payloads: false

    store_pii: false

    store_secrets: false


# ==============================================================================
# 18. EXECUTION & RESOURCE CONTROLS
# ==============================================================================

execution:

  timeout_seconds: 3600

  max_memory_gb: 16

  max_cpu_workers: 8

  parallel_model_evaluation: true

  parallel_slice_evaluation: true

  max_parallel_models: 3

  max_parallel_slices: 8

  cancellation_on_global_failure: true

  retry:

    enabled: false

    reason: >
      Evaluation failures must not be hidden by automatic retries. Infrastructure
      retries must be handled by the orchestration layer and recorded separately.


# ==============================================================================
# 19. SECURITY CONTROLS
# ==============================================================================

security:

  zero_trust_inputs: true

  validate_all_paths: true

  prohibit_path_traversal: true

  prohibit_symlink_escape: true

  require_artifact_hash_before_read: true

  require_dataset_hash_before_evaluation: true

  require_manifest_before_evaluation: true

  prohibit_untrusted_code_execution: true

  prohibit_remote_code_loading: true

  prohibit_network_access_during_evaluation: true

  secrets:

    allowed: false

    environment_references_allowed: true

    log_secrets: false


# ==============================================================================
# 20. ARTIFACT OUTPUT & ATOMICITY
# ==============================================================================

artifacts:

  evaluation_reports:

    immutable: true

    prohibit_overwrite: true

    require_atomic_write: true

    require_sha256: true

    generate_manifest: true

  gate_result:

    required: true

    filename: "gate_result.json"

    schema_version: "1.0.0"

    immutable: true

    signed_for_production: true


# ==============================================================================
# 21. QUALITY-GATE ENGINE VALIDATION
# ==============================================================================

validation:

  enabled: true

  validate_on_startup: true

  fail_on_invalid_configuration: true

  checks:

    schema_validity: true

    model_ids_unique: true

    thresholds_valid: true

    metric_ranges_valid: true

    confidence_levels_valid: true

    bootstrap_configuration_valid: true

    minimum_support_valid: true

    regression_margins_valid: true

    slice_thresholds_valid: true

    dataset_contract_valid: true

    provenance_contract_valid: true

    artifact_contract_valid: true

    security_policy_valid: true

  numeric_ranges:

    probabilities:
      minimum: 0.0
      maximum: 1.0

    confidence_level:
      minimum: 0.90
      maximum: 0.999

    alpha:
      minimum: 0.001
      maximum: 0.10

    bootstrap_samples:
      minimum: 1000
      maximum: 100000

  consistency_checks:

    f1_must_be_consistent_with_precision_recall: true

    thresholds_must_match_model_manifest: true

    positive_label_must_match_model_config: true

    feature_schema_must_match_model_manifest: true

    preprocessing_hash_must_match_model_manifest: true

    test_dataset_must_not_be_used_for_threshold_selection: true

    test_dataset_must_not_be_used_for_calibration: true

    ood_dataset_must_not_be_used_for_training: true

    production_baseline_must_not_equal_candidate: true

    required_slices_must_have_support: true


# ==============================================================================
# 22. CLI EXIT CODES
# ==============================================================================

execution.cli_exit_codes:

  success_all_passed: 0

  gate_failure: 1

  configuration_validation_error: 2

  dataset_integrity_error: 3

  provenance_error: 4

  statistical_evaluation_error: 5

  artifact_validation_error: 6

  security_policy_error: 7

  system_error: 10