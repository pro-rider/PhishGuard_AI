        required: true

        minimum_samples: 200
        minimum_positive_samples: 50
        minimum_negative_samples: 100

        precision:
          minimum: 0.9990
          gate_on: "lower_confidence_bound"

        recall:
          minimum: 0.9500
          gate_on: "lower_confidence_bound"

        false_positive_rate:
          maximum: 0.0002
          gate_on: "upper_confidence_bound"

      display_name_spoofing:

        required: true

        minimum_samples: 200

        precision:
          minimum: 0.9920
          gate_on: "lower_confidence_bound"

        recall:
          minimum: 0.9600
          gate_on: "lower_confidence_bound"

      bec_financial_requests:

        required: true

        minimum_samples: 300

        precision:
          minimum: 0.9950
          gate_on: "lower_confidence_bound"

        recall:
          minimum: 0.9500
          gate_on: "lower_confidence_bound"

      zero_day_domains:

        required: true

        minimum_samples: 200

        precision:
          minimum: 0.9850
          gate_on: "lower_confidence_bound"

        recall:
          minimum: 0.9000
          gate_on: "lower_confidence_bound"


