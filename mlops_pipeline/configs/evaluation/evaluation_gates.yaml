# ==============================================================================
# PhishGuard_AI - Global Evaluation Gates Specification
# Version: 13.0.0
# File:
#   mlops_pipeline/configs/evaluation/evaluation_gates.yaml
#
# Purpose
# -------
# Centralized production evaluation contract for:
#
#   URL classifier
#   Email classifier
#   Attachment classifier
#
# Evaluation lifecycle:
#
#   candidate artifact
#       |
#       v
#   schema / provenance validation
#       |
#       v
#   validation evaluation
#       |
#       v
#   frozen test evaluation
#       |
#       v
#   OOD evaluation
#       |
#       v
#   calibration evaluation
#       |
#       v
#   slice evaluation
#       |
#       v
#   production regression comparison
#       |
#       v
#   statistical uncertainty evaluation
#       |
#       v
#   final gate decision
#
# Design principles
# -----------------
# - fail closed
# - zero-trust evaluation inputs
# - frozen test sets
# - immutable OOD holdouts
# - threshold integrity
# - confidence intervals
# - minimum statistical support
# - non-inferiority regression testing
# - slice-aware evaluation
# - calibration validation
# - OOD / abstention evaluation
# - reproducible evaluation
# - complete provenance
# - machine-readable gate results
#
# IMPORTANT
# ---------
# No secrets, credentials, API keys, private keys, tokens, passwords, or raw
# payloads may be stored in this configuration.
# ==============================================================================


# ==============================================================================
# 0. SCHEMA & COMPATIBILITY CONTRACT
# ==============================================================================

schema:

  schema_version: "1.0.0"
  config_version: "13.0.0"
  gate_contract_version: "13.0.0"

  strict:
    reject_unknown_keys: true
    reject_unknown_models: true
    reject_unknown_metrics: true
    reject_unknown_slices: false
    reject_missing_required_fields: true
    reject_duplicate_metric_definitions: true

  compatibility:

    minimum_pipeline_version: "13.0.0"

    evaluation_engine:
      minimum_version: "1.0.0"

    supported_task_types:
      - "binary_classification"

    supported_positive_labels:
      - 1


# ==============================================================================
# 1. GLOBAL EVALUATION POLICY
# ==============================================================================

evaluation_policy:

  policy_id: "global_production_gate_v13"

  enabled: true

  environment_enforcement:

    development:
      enabled: false
      strict: false

    test:
      enabled: true
      strict: true

    staging:
      enabled: true
      strict: true

    production:
      enabled: true
      strict: true

  # --------------------------------------------------------------------------
  # Failure behavior
  # --------------------------------------------------------------------------

  failure_mode: "fail_closed"

  fail_on:

    required_metric_missing: true
    metric_computation_error: true
    dataset_integrity_failure: true
    provenance_failure: true
    threshold_integrity_failure: true
    confidence_interval_failure: true
    slice_support_failure: true
    calibration_failure: true
    regression_failure: true
    statistical_test_failure: true

  quarantine:

    enabled: true

    on_gate_failure: true
    on_evaluation_error: true
    on_provenance_failure: true
    on_integrity_failure: true

    directory: "artifacts/quarantine/failed_evaluations"

    require_atomic_quarantine: true


# ==============================================================================
# 2. REPRODUCIBILITY
# ==============================================================================

reproducibility:

  enabled: true

  random_seed: 42

  deterministic_evaluation: true

  capture:

    evaluator_version: true
    python_version: true
    framework_versions: true
    dependency_lock_hash: true

    operating_system: true
    hardware_summary: true

    git_commit: true
    git_dirty_state: true

    evaluation_config_hash: true
    resolved_config_hash: true

    dataset_manifest_hash: true
    model_manifest_hash: true
    feature_schema_hash: true

  require_reproducible_run_id: true


# ==============================================================================
# 3. DATASET TRUST & INTEGRITY
# ==============================================================================

datasets:

  # --------------------------------------------------------------------------
  # General dataset requirements
  # --------------------------------------------------------------------------

  global:

    require_manifest: true

    require_sha256: true

    checksum_algorithm: "sha256"

    require_dataset_version: true

    require_schema_version: true

    require_feature_schema_hash: true

    require_label_schema_hash: true

    reject_duplicate_sample_ids: true

    reject_missing_labels: true

    reject_nan_predictions: true

    reject_inf_predictions: true

    prohibit_training_data_overlap: true

    prohibit_validation_test_overlap: true

    prohibit_test_ood_overlap: true

    prohibit_feedback_queue_overlap: true

  # --------------------------------------------------------------------------
  # Validation set
  # --------------------------------------------------------------------------

  validation:

    required: true

    mutable: false

    purpose:
      - "threshold_selection"
      - "calibration"
      - "early_evaluation"

    allow_model_selection: true

  # --------------------------------------------------------------------------
  # Test set
  # --------------------------------------------------------------------------

  test:

    required: true

    frozen: true

    immutable: true

    allow_model_selection: false

    allow_threshold_selection: false

    allow_calibration_fit: false

    allow_hyperparameter_tuning: false

    allow_feature_selection: false

    require_unseen_samples: true

  # --------------------------------------------------------------------------
  # OOD set
  # --------------------------------------------------------------------------

  out_of_distribution:

    required_for_production: true

    frozen: true

    immutable: true

    allow_model_selection: false

    allow_threshold_selection: false

    require_distribution_shift_documentation: true

    require_dataset_origin_documentation: true

    require_temporal_or_source_separation: true


# ==============================================================================
# 4. DATASET MINIMUM SUPPORT REQUIREMENTS
# ==============================================================================

minimum_support:

  global:

    total_samples: 10000

    positive_samples: 1000

    negative_samples: 5000

  test:

    total_samples: 5000

    positive_samples: 500

    negative_samples: 2500

  ood:

    total_samples: 3000

    positive_samples: 300

    negative_samples: 1500

  bootstrap:

    minimum_samples: 5000

    minimum_positive_samples: 500

    minimum_negative_samples: 2500

  slices:

    minimum_total_samples: 200

    minimum_positive_samples: 50

    minimum_negative_samples: 100

    insufficient_support_action: "fail"


# ==============================================================================
# 5. METRIC COMPUTATION CONTRACT
# ==============================================================================

metrics:

  positive_class:

    label: 1

  binary_classification:

    averaging: "binary"

    zero_division: "fail"

  thresholded_metrics:

    require_operating_threshold: true

    threshold_source:

      allowed:
        - "validated_threshold_artifact"
        - "model_manifest"

      forbidden:
        - "test_optimized"
        - "production_optimized"

    threshold_precision: 6

  ranking_metrics:

    roc_auc:
      higher_is_better: true

    pr_auc:
      implementation: "average_precision"
      higher_is_better: true

  classification_metrics:

    precision:
      higher_is_better: true

    recall:
      higher_is_better: true

    f1:
      higher_is_better: true

    false_positive_rate:
      higher_is_better: false

    false_negative_rate:
      higher_is_better: false

    specificity:
      higher_is_better: true

  calibration_metrics:

    brier_score:
      lower_is_better: true

    expected_calibration_error:
      lower_is_better: true

    maximum_calibration_error:
      lower_is_better: true

    log_loss:
      lower_is_better: true

  operational_metrics:

    coverage:
      higher_is_better: true

    abstention_rate:
      lower_is_better: true

    selective_risk:
      lower_is_better: true


# ==============================================================================
# 6. CONFIDENCE INTERVAL POLICY
# ==============================================================================

confidence_intervals:

  enabled: true

  method: "bootstrap"

  confidence_level: 0.99

  interval_type: "percentile"

  bootstrap_samples: 5000

  random_seed: 42

  resampling_unit: "sample_id"

  stratified_resampling: true

  paired_resampling_for_comparison: true

  replacement: true

  minimum_effective_bootstrap_samples: 4500

  metric_rules:

    higher_is_better:

      precision:
        gate_on: "lower_bound"

      recall:
        gate_on: "lower_bound"

      f1:
        gate_on: "lower_bound"

      roc_auc:
        gate_on: "lower_bound"

      pr_auc:
        gate_on: "lower_bound"

      specificity:
        gate_on: "lower_bound"

    lower_is_better:

      false_positive_rate:
        gate_on: "upper_bound"

      false_negative_rate:
        gate_on: "upper_bound"

      brier_score:
        gate_on: "upper_bound"

      expected_calibration_error:
        gate_on: "upper_bound"

      maximum_calibration_error:
        gate_on: "upper_bound"

      log_loss:
        gate_on: "upper_bound"

      abstention_rate:
        gate_on: "upper_bound"

      selective_risk:
        gate_on: "upper_bound"


# ==============================================================================
# 7. STATISTICAL COMPARISON POLICY
# ==============================================================================

statistical_comparison:

  enabled: true

  comparison_target:

    production_baseline_required: true

    baseline_source:
      allowed:
        - "production_registry"
        - "known_good_artifact"

    baseline_must_be_immutable: true

    candidate_and_baseline_must_share_test_set: true

  # --------------------------------------------------------------------------
  # Paired bootstrap
  # --------------------------------------------------------------------------

  paired_bootstrap:

    enabled: true

    samples: 5000

    confidence_level: 0.99

    interval_type: "percentile"

    resampling_unit: "sample_id"

    stratified_by_label: true

    compare_metric_difference: true

    difference_definition:
      candidate_minus_baseline: true

  # --------------------------------------------------------------------------
  # McNemar
  # --------------------------------------------------------------------------

  mcnemar:

    enabled: true

    required_for_thresholded_classifier_comparison: true

    exact: true

    continuity_correction: false

    alpha: 0.01

    require_paired_predictions: true

    minimum_discordant_pairs: 25

  # --------------------------------------------------------------------------
  # Statistical significance
  # --------------------------------------------------------------------------

  significance:

    enabled: true

    alpha: 0.01

    multiple_comparison_correction:
      enabled: true
      method: "holm"

  # --------------------------------------------------------------------------
  # IMPORTANT:
  # Statistical significance alone cannot determine promotion.
  # Practical regression/non-inferiority margins are evaluated separately.
  # --------------------------------------------------------------------------

  practical_significance:

    required: true

    promotion_requires:

      absolute_gate_pass: true

      confidence_interval_gate_pass: true

      practical_regression_gate_pass: true


# ==============================================================================
# 8. REGRESSION / NON-INFERIORITY POLICY
# ==============================================================================

regression_policy:

  enabled: true

  default:

    allow_regression: false

    require_non_inferiority: true

    confidence_level: 0.99

  interpretation:

    higher_is_better:
      candidate_minus_baseline_must_be_greater_than_or_equal_to:
        - "negative_margin"

    lower_is_better:
      candidate_minus_baseline_must_be_less_than_or_equal_to:
        - "positive_margin"

  # Statistical significance must NOT be interpreted as "candidate must have
  # p <= 0.01 to be better". A candidate can be practically equivalent and
  # still be eligible for promotion if it satisfies the non-inferiority margin.


# ==============================================================================
# 9. MODEL EVALUATION GATES
# ==============================================================================

models:

  # ============================================================================
  # EMAIL CLASSIFIER
  # ============================================================================

  email_classifier:

    enabled: true

    model_id: "email_classifier"

    task_type: "binary_classification"

    positive_label: 1

    primary_metric: "pr_auc"

    threshold:

      expected_value: 0.900000

      tolerance: 0.000001

      source: "validated_threshold_artifact"

      require_manifest_match: true

      forbid_test_set_optimization: true

    evaluation_sets:

      validation:
        required: true

      test:
        required: true

      out_of_distribution:
        required: true

    global_thresholds:

      precision:
        minimum: 0.9950
        gate_on: "lower_confidence_bound"

      recall:
        minimum: 0.9400
        gate_on: "lower_confidence_bound"

      f1:
        minimum: 0.9667
        gate_on: "lower_confidence_bound"

      roc_auc:
        minimum: 0.9920
        gate_on: "lower_confidence_bound"

      pr_auc:
        minimum: 0.9700
        gate_on: "lower_confidence_bound"

      false_positive_rate:
        maximum: 0.0010
        gate_on: "upper_confidence_bound"

      false_negative_rate:
        maximum: 0.0600
        gate_on: "upper_confidence_bound"

    minimum_support:

      test:
        total: 5000
        positive: 500
        negative: 2500

    calibration:

      enabled: true

      fit_dataset: "validation"

      evaluate_dataset: "test"

      forbidden_fit_datasets:
        - "test"
        - "ood"
        - "production"

      methods:

        primary:
          name: "temperature_scaling"

        comparison:
          enabled: true
          candidates:
            - "temperature_scaling"
            - "sigmoid"

      metrics:

        expected_calibration_error:
          maximum: 0.0500
          bins: 15
          binning: "uniform"
          gate_on: "upper_confidence_bound"

        brier_score:
          maximum: 0.1000
          gate_on: "upper_confidence_bound"

        log_loss:
          maximum: 0.3000
          gate_on: "upper_confidence_bound"

      require_reliability_curve: true

    regression:

      enabled: true

      baseline_required: true

      limits:

        pr_auc:
          maximum_degradation: 0.0000
          confidence_bound: "lower"

        recall:
          maximum_degradation: 0.0020
          confidence_bound: "lower"

        fpr:
          maximum_increase: 0.0001
          confidence_bound: "upper"

        precision:
          maximum_degradation: 0.0010
          confidence_bound: "lower"

      mcnemar_required: true

    critical_slices:

