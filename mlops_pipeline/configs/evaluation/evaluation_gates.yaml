      recall:
        minimum: 0.9600
        gate_on: "lower_confidence_bound"

      f1:
        minimum: 0.9747
        gate_on: "lower_confidence_bound"

      roc_auc:
        minimum: 0.9950
        gate_on: "lower_confidence_bound"

      pr_auc:
        minimum: 0.9800
        gate_on: "lower_confidence_bound"

      false_positive_rate:
        maximum: 0.0020
        gate_on: "upper_confidence_bound"

      false_negative_rate:
        maximum: 0.0400
        gate_on: "upper_confidence_bound"

