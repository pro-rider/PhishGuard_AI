[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ai"
version = "14.0.0"
description = "Enterprise-grade AI phishing detection platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.33.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]

[tool.setuptools]
packages = [
    "api_gateway", "core", "engine", "security", "storage", "policy",
    "quarantine", "sandbox", "case_management", "observability",
    "messaging", "ioc", "reputation", "ml_inference",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast unit tests", "integration: integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "mlops_pipeline",
    "migrations",
    "venv",
    "storage/data",
    "frontend/_shots",
]

[tool.ruff.lint]
# CI lint gate: focus on *correctness* rules (undefined names, unused imports,
# genuine style regressions) rather than stylistic rewrites (pyupgrade UP*,
# import sorting I001), so the large legacy analyzer tree doesn't block checks.
select = ["F", "E", "W", "B"]
# B905: zip-without-explicit-strict style nit; B904: raise-from chaining is a
# best-practice lint, not a correctness error — tracked separately.
ignore = ["B905", "B904", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]